name: Temporary #122 sync accessible Results

on:
  push:
    branches:
      - codex/122-noncolor-figure-alternatives

concurrency:
  group: tmp-122-sync-results
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/122-noncolor-figure-alternatives
          path: website
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned Results source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gother-Labs/gother-labs-results
          ref: 58b70d546969a1a4b8f37fa3c77fddafe0cd96d4
          path: gother-labs-results
          fetch-depth: 1
          persist-credentials: false

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.node-version

      - name: Sync source-owned Results surfaces
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: |
          node tools/sync-results.mjs
          node tools/sync-results.mjs --check

      - name: Harden generated figure semantics
        working-directory: website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/sync-results.mjs")
          text = path.read_text()

          old_asset = '''function paperAssetFigure({ src, caption, number }) {
            return `<figure class="result-paper-asset" id="fig-${number}">
                    <img src="./${escapeHtml(src)}" alt="">
                    <figcaption>Figure ${number}. ${formatPaperCaption(caption)}</figcaption>
                  </figure>`;
          }'''.replace("            ", "")
          new_asset = '''function paperAssetFigure({ src, caption, number }) {
            const captionId = `fig-${number}-caption`;
            return `<figure class="result-paper-asset" id="fig-${number}" role="group" aria-labelledby="${captionId}">
                    <img src="./${escapeHtml(src)}" alt="" aria-hidden="true">
                    <figcaption id="${captionId}">Figure ${number}. ${formatPaperCaption(caption)}</figcaption>
                  </figure>`;
          }'''.replace("            ", "")
          if old_asset in text:
              text = text.replace(old_asset, new_asset, 1)
          elif 'aria-labelledby="${captionId}"' not in text:
              raise SystemExit("paperAssetFigure contract not found")

          pattern = re.compile(
              r'  const figures = plots\n'
              r'    \.map\(\n'
              r'      \(plot\) => `<figure class="result-figure">[\s\S]*?'
              r'\n    \)\n'
              r'    \.join\("\\n"\);'
          )
          replacement = '''  const figures = plots
            .map((plot, index) => {
              const caption = full.website?.figure_captions?.[plot];
              if (!caption) {
                throw new Error(`Published plot ${plot} for ${full.slug} is missing an accessible figure caption.`);
              }
              const captionId = `result-figure-${index + 1}-caption`;
              return `<figure class="result-figure" role="group" aria-labelledby="${captionId}">
                    <img src="./${escapeHtml(plot)}" alt="" aria-hidden="true">
                    <figcaption id="${captionId}">${escapeHtml(caption)}</figcaption>
                  </figure>`;
            })
            .join("\\n");'''.replace("            ", "")
          text, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count == 0 and 'Published plot ${plot} for ${full.slug} is missing an accessible figure caption.' not in text:
              raise SystemExit("generic result figure contract not found")

          path.write_text(text)
          PY

      - name: Validate synchronization
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: |
          node tools/sync-results.mjs --check
          git diff --check

      - name: Commit synced Results surfaces and generator contract
        working-directory: website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results tools/generated-result-content-contract.json tools/sync-results.mjs
          if git diff --cached --quiet; then
            echo "No Results accessibility changes to commit"
            exit 0
          fi
          git commit -m "fix(a11y): sync and harden result figure alternatives"
          git push origin HEAD:codex/122-noncolor-figure-alternatives
