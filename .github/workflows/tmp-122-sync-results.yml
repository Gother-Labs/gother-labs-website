name: Temporary #122 sync accessible Results

on:
  push:
    branches:
      - codex/122-noncolor-figure-alternatives

concurrency:
  group: tmp-122-sync-results
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/122-noncolor-figure-alternatives
          path: website
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned Results source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gother-Labs/gother-labs-results
          ref: 58b70d546969a1a4b8f37fa3c77fddafe0cd96d4
          path: gother-labs-results
          fetch-depth: 1
          persist-credentials: false

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.node-version

      - name: Sync source-owned Results surfaces
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: |
          node tools/sync-results.mjs
          node tools/sync-results.mjs --check
          git diff --check

      - name: Commit synced Results surfaces
        working-directory: website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results tools/generated-result-content-contract.json
          if git diff --cached --quiet; then
            echo "No Results sync changes to commit"
            exit 0
          fi
          git commit -m "chore(results): sync accessible replay figures"
          git push origin HEAD:codex/122-noncolor-figure-alternatives
