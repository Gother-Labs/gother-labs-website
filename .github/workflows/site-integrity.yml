name: Site integrity

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: website
          fetch-depth: 0
          persist-credentials: false

      - name: Use the release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.node-version

      - name: Read pinned results source
        id: results-source
        working-directory: website
        run: >-
          node -e 'const fs = require("node:fs");
          const lock = JSON.parse(fs.readFileSync("tools/generated-results.lock.json", "utf8"));
          if (lock.schema_version !== "generated-results-source/v1" ||
              lock.repository !== "Gother-Labs/gother-labs-results" ||
              !/^[0-9a-f]{40}$/.test(lock.commit) ||
              !["results-catalog/v1", "results-catalog/v2"].includes(lock.catalog_schema)) {
            throw new Error("Generated-results lock is invalid; refusing to expose it as workflow output.");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${lock.commit}\n`);'

      - name: Checkout pinned results source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gother-Labs/gother-labs-results
          ref: ${{ steps.results-source.outputs.commit }}
          path: gother-labs-results
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned Results provenance
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: node tools/check-results-source-provenance.mjs

      - name: Test release-quality checks
        working-directory: website
        run: node --test tools/*.test.mjs

      - name: Check result Markdown contract
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: node tools/check-result-markdown.mjs

      - name: Check shared site shell
        working-directory: website
        run: node tools/check-site-shell.mjs

      - name: Build exact Pages artifact
        working-directory: website
        run: node tools/build-pages-artifact.mjs --output _site

      - name: Check links, metadata, sitemap, and HTML
        working-directory: website
        run: node tools/check-site-integrity.mjs --site-root _site

      - name: Check bounded RTL claims
        working-directory: website
        run: node tools/check-rtl-page.mjs

      - name: Check generated results and artifacts
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: node tools/sync-results.mjs --check

      - name: Check patch whitespace
        working-directory: website
        env:
          GOTHER_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$GOTHER_DIFF_BASE" ] ||
             [ "$GOTHER_DIFF_BASE" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$GOTHER_DIFF_BASE^{commit}"; then
            GOTHER_DIFF_BASE="$(git rev-parse HEAD^)"
          fi
          git diff --check "$GOTHER_DIFF_BASE...HEAD"
