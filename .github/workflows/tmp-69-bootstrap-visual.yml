name: Temporary #69 visual baseline bootstrap

on:
  push:
    branches:
      - codex/69-browser-visual-regression

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/69-browser-visual-regression
          fetch-depth: 0
          persist-credentials: true

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Resolve pinned browser dependency
        run: npm install --ignore-scripts

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines
        run: npm run test:visual:update

      - name: Verify generated baselines
        run: npm run test:visual

      - name: Commit lockfile and visual baselines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test(browser): pin visual regression baselines"
          git push origin HEAD:codex/69-browser-visual-regression
