name: Temporary #90 Google scheduling implementation

on:
  push:
    branches:
      - codex/90-google-technical-scoping

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/90-google-technical-scoping
          fetch-depth: 0
          persist-credentials: true

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version

      - name: Apply scheduling changes
        run: |
          set -euo pipefail
          node tools/tmp-90-google-scheduling.mjs
          node tools/check-rtl-page.mjs
          git diff --check

      - name: Commit branch output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtl-optimization/index.html contact/index.html tools/check-rtl-page.mjs
          if git diff --cached --quiet; then
            echo "No scheduling changes to commit"
            exit 0
          fi
          git commit -m "feat(contact): add Google technical scoping booking"
          git push origin HEAD:codex/90-google-technical-scoping
