name: Temporary 123 responsive table semantics

on:
  push:
    branches:
      - codex/123-responsive-table-semantics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/123-responsive-table-semantics
          fetch-depth: 0
          persist-credentials: false

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version

      - name: Install browser QA dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Build exact Pages artifact
        run: node tools/build-pages-artifact.mjs --output _site

      - name: Run table accessibility browser contract
        run: npx playwright test tests/visual/table-accessibility.spec.mjs --config=playwright.config.mjs

      - name: Check patch whitespace
        run: git diff --check
