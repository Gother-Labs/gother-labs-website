name: Temporary 123 responsive table semantics

on:
  push:
    branches:
      - codex/123-responsive-table-semantics

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/123-responsive-table-semantics
          path: website
          fetch-depth: 0
          persist-credentials: true

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: website/.node-version

      - name: Normalize curated Result tables
        working-directory: website
        run: python3 tools/tmp-123-curated.py

      - name: Validate semantic contracts
        working-directory: website
        run: |
          node --test tools/*.test.mjs
          git diff --check

      - name: Commit curated Result tables
        working-directory: website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/iberian-bess-policy-challenge/index.html \
            results/quadrature-rule-optimization/index.html \
            results/qubit-routing-lightsabre/index.html \
            results/rcpsp-psplib-j30/index.html
          if git diff --cached --quiet; then
            echo "No curated #123 table changes to commit"
            exit 1
          fi
          git commit -m "fix(a11y): bind curated Result table headers"
          git push origin HEAD:codex/123-responsive-table-semantics
