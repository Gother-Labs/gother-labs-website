name: Temporary 124 sync BESS replay

on:
  push:
    branches:
      - codex/124-bess-replay-live-text

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout website branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/124-bess-replay-live-text
          path: website
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned Results source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Gother-Labs/gother-labs-results
          ref: 03e7c1e08887cdaff8c64c049c38276af0451a03
          path: gother-labs-results
          fetch-depth: 1
          persist-credentials: false

      - name: Use release Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.node-version

      - name: Synchronize pinned Results
        working-directory: website
        env:
          GOTHER_RESULTS_ROOT: ../gother-labs-results
        run: |
          node tools/sync-results.mjs
          node tools/sync-results.mjs --check
          node --test tools/*.test.mjs
          git diff --check

      - name: Commit synchronized replay
        working-directory: website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results index.html sitemap.xml tools/generated-result-content-contract.json
          if git diff --cached --quiet; then
            echo "No synchronized Result changes found"
            exit 1
          fi
          git commit -m "chore(results): sync accessible BESS replay"
          git push origin HEAD:codex/124-bess-replay-live-text
