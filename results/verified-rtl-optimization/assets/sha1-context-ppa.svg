<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" role="img" aria-label="SHA-1 architecture context and paired PPA estimate">
  <rect width="1240" height="520" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:24px;font-weight:700}.node{font-size:14px;font-weight:700}.body{font-size:15px}.small{font-size:12.5px;fill:#5f5f5f}.box{fill:#fff;stroke:#111;stroke-width:1.8}.hot{fill:#fff;stroke:#005bff;stroke-width:2.5}.line{fill:none;stroke:#111;stroke-width:2}.muted{fill:none;stroke:#c4c4c4;stroke-width:1}.ci{stroke:#005bff;stroke-width:2.2;stroke-linecap:round}.dot{fill:#005bff}.tick{font-size:11px;fill:#686868}
  </style>
  <text x="48" y="44" class="title">SHA-1 implementation path</text>
  <text x="700" y="44" class="title">Paired implementation estimate</text>
  <text x="700" y="68" class="small">64 publication pairs · two-sided 95% intervals</text>
  <path class="muted" d="M655 28V458"/>

  <g transform="translate(48 104)">
    <rect class="box" x="0" y="58" width="108" height="70" rx="7"/>
    <text x="54" y="86" text-anchor="middle" class="node">512-bit block</text>
    <text x="54" y="108" text-anchor="middle" class="small">32-bit I/O</text>
    <path class="line" d="M108 93H145"/>
    <rect class="box" x="145" y="48" width="126" height="90" rx="7"/>
    <text x="208" y="80" text-anchor="middle" class="node">Command + state</text>
    <text x="208" y="103" text-anchor="middle" class="small">protocol · registers</text>
    <path class="line" d="M271 93H306"/>
    <rect class="hot" x="306" y="30" width="166" height="126" rx="7"/>
    <text x="389" y="64" text-anchor="middle" class="node">80-round engine</text>
    <text x="389" y="88" text-anchor="middle" class="small">choose / parity / majority</text>
    <text x="389" y="110" text-anchor="middle" class="small">rotates + additions</text>
    <text x="389" y="136" text-anchor="middle" class="small">shared Boolean terms</text>
    <path class="line" d="M472 93H505"/>
    <rect class="hot" x="505" y="58" width="96" height="70" rx="7"/>
    <text x="553" y="86" text-anchor="middle" class="node">Readout</text>
    <text x="553" y="108" text-anchor="middle" class="small">A · B · C · D · E</text>

    <text x="0" y="216" class="body">The accepted RTL shares XOR terms, exploits mutually exclusive choose terms,</text>
    <text x="0" y="240" class="body">and removes the temporary 160-bit readout concatenation.</text>
    <text x="0" y="274" class="small">Interface, protocol, cycle behavior, latency, and output order remain fixed.</text>
  </g>

  <g>
    <path class="muted" d="M790 110V402M910 110V402M1030 110V402M1150 110V402"/>
    <text x="790" y="424" class="tick" text-anchor="middle">0%</text><text x="910" y="424" class="tick" text-anchor="middle">2%</text><text x="1030" y="424" class="tick" text-anchor="middle">4%</text><text x="1150" y="424" class="tick" text-anchor="middle">6%</text>
    <text x="700" y="136" class="body">Area</text><line class="ci" x1="794.8" y1="132" x2="802.6" y2="132"/><line class="ci" x1="794.8" y1="126" x2="794.8" y2="138"/><line class="ci" x1="802.6" y1="126" x2="802.6" y2="138"/><circle class="dot" cx="799.0" cy="132" r="5"/><text x="1210" y="136" class="small" text-anchor="end">0.15%</text>
    <text x="700" y="206" class="body">Delay</text><line class="ci" x1="1068.4" y1="202" x2="1135.0" y2="202"/><line class="ci" x1="1068.4" y1="196" x2="1068.4" y2="208"/><line class="ci" x1="1135.0" y1="196" x2="1135.0" y2="208"/><circle class="dot" cx="1102.0" cy="202" r="5"/><text x="1210" y="206" class="small" text-anchor="end">5.20%</text>
    <text x="700" y="276" class="body">Power</text><line class="ci" x1="843.4" y1="272" x2="902.2" y2="272"/><line class="ci" x1="843.4" y1="266" x2="843.4" y2="278"/><line class="ci" x1="902.2" y1="266" x2="902.2" y2="278"/><circle class="dot" cx="872.8" cy="272" r="5"/><text x="1210" y="276" class="small" text-anchor="end">1.38%</text>
    <text x="700" y="346" class="body">Composite</text><line class="ci" x1="917.2" y1="342" x2="934.6" y2="342"/><line class="ci" x1="917.2" y1="336" x2="917.2" y2="348"/><line class="ci" x1="934.6" y1="336" x2="934.6" y2="348"/><circle class="dot" cx="926.2" cy="342" r="5"/><text x="1210" y="346" class="small" text-anchor="end">2.27%</text>
  </g>
  <text x="700" y="462" class="small">Improvement versus the frozen baseline; lower ratios map to positive improvement.</text>
</svg>
