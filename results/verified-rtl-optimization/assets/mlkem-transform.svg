<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-label="ML-KEM CBD before-and-after RTL rewrite from variable 16/24-bit wide-state movement to fixed 24-bit movement plus a two-bit phase preserving the logical state view">
  <rect width="960" height="350" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.rtl{font-size:17px;font-family:Menlo,Consolas,monospace;font-weight:650}.body{font-size:17px}.small{font-size:13.5px;fill:#5f5f5f}.box{fill:#fff;stroke:#111;stroke-width:2}.accent{fill:none;stroke:#005bff;stroke-width:4}.line{fill:none;stroke:#111;stroke-width:2.5}.blue{fill:#005bff}
  </style>
  <g transform="translate(56 48)">
    <text x="0" y="0" class="rtl">RTL₀</text>
    <rect class="box" x="0" y="24" width="356" height="216" rx="8"/>
    <rect x="28" y="77" width="298" height="52" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
    <text x="47" y="108" class="body">1,096-bit state</text>
    <path class="line" d="M52 158H286"/><path class="blue" d="M286 158l-14-8v16z"/>
    <text x="66" y="190" class="small">variable 16-bit / 24-bit movement</text>

    <path class="line" d="M388 132H466"/><path class="blue" d="M466 132l-14-8v16z"/>

    <text x="500" y="0" class="rtl">RTL₁</text>
    <rect class="box" x="500" y="24" width="356" height="216" rx="8"/>
    <rect x="524" y="72" width="250" height="52" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
    <text x="543" y="103" class="body">1,096-bit physical state</text>
    <rect x="790" y="72" width="42" height="52" fill="#005bff"/>
    <text x="799" y="104" style="font:700 16px Arial;fill:white">2b</text>
    <path class="accent" d="M548 150H787"/><path class="blue" d="M787 150l-14-8v16z"/>
    <text x="546" y="181" class="small">fixed 24-bit movement + phase</text>
    <text x="546" y="207" class="small">logical view reconstructs baseline head</text>
  </g>
  <text x="56" y="306" class="small">Reset/load/stall behavior, eta modes, write addresses, termination, outputs, and cycle timing are unchanged.</text>
</svg>
