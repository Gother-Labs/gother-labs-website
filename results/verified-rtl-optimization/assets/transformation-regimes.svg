<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Three RTL transformations across Boolean logic, arithmetic reduction, and state representation">
  <rect width="960" height="430" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:26px;font-weight:700}.case{font-size:18px;font-weight:700}.body{font-size:18px}.small{font-size:14px;fill:#5f5f5f}.box{fill:#fff;stroke:#111;stroke-width:2}.accent{fill:none;stroke:#005bff;stroke-width:4}.line{fill:none;stroke:#111;stroke-width:2.5}.muted{fill:none;stroke:#b9b9b9;stroke-width:2}
  </style>
  <text x="48" y="48" class="title">Three RTL structures, three different rewrites</text>
  <g transform="translate(48 92)">
    <rect class="box" x="0" y="0" width="270" height="250" rx="8"/>
    <text x="20" y="36" class="case">SHA-1</text>
    <text x="20" y="67" class="body">Shared Boolean structure</text>
    <path class="muted" d="M42 119H102M42 159H102"/>
    <circle cx="42" cy="119" r="7" fill="#111"/><circle cx="42" cy="159" r="7" fill="#111"/>
    <circle cx="102" cy="119" r="7" fill="#111"/><circle cx="102" cy="159" r="7" fill="#111"/>
    <path class="accent" d="M122 139H215"/>
    <circle cx="225" cy="139" r="10" fill="#005bff"/>
    <text x="20" y="222" class="small">shared terms + direct state readout</text>

    <rect class="box" x="298" y="0" width="270" height="250" rx="8"/>
    <text x="318" y="36" class="case">INT8 MatVec</text>
    <text x="318" y="67" class="body">Range-correct reduction tree</text>
    <circle cx="338" cy="109" r="6" fill="#111"/><circle cx="390" cy="109" r="6" fill="#111"/>
    <circle cx="448" cy="109" r="6" fill="#111"/><circle cx="500" cy="109" r="6" fill="#111"/>
    <path class="line" d="M338 115L365 149M390 115L365 149M448 115L475 149M500 115L475 149"/>
    <circle cx="365" cy="154" r="7" fill="#005bff"/><circle cx="475" cy="154" r="7" fill="#005bff"/>
    <path class="accent" d="M365 161L420 199M475 161L420 199"/>
    <circle cx="420" cy="205" r="9" fill="#005bff"/>
    <text x="318" y="222" class="small">16-bit → 17-bit → 18-bit → INT32</text>

    <rect class="box" x="596" y="0" width="270" height="250" rx="8"/>
    <text x="616" y="36" class="case">ML-KEM CBD</text>
    <text x="616" y="67" class="body">State representation</text>
    <rect x="620" y="109" width="170" height="42" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
    <text x="626" y="135" class="small">1096-bit physical state</text>
    <rect x="810" y="109" width="34" height="42" fill="#005bff"/>
    <text x="817" y="135" style="font:700 14px Arial;fill:white">2b</text>
    <path class="accent" d="M620 169H790"/>
    <text x="616" y="198" class="small">fixed 24-bit movement + phase</text>
    <text x="616" y="222" class="small">same logical state view</text>
  </g>
</svg>
