<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" role="img" aria-label="RTL design through physical implementation and PPA measurement">
  <rect width="1160" height="590" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.stage{font-size:16px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#5f5f5f}.box{fill:#fff;stroke:#111;stroke-width:2}.soft{fill:#f6f7f9;stroke:#bdbdbd;stroke-width:1.4}.blue{fill:#005bff}.blueStroke{fill:none;stroke:#005bff;stroke-width:3}.line{fill:none;stroke:#111;stroke-width:2.2}
  </style>
  <text x="56" y="50" class="title">RTL structure becomes physical implementation</text>
  <text x="56" y="80" class="small">The frozen source contract constrains what synthesis and downstream implementation may change.</text>

  <g transform="translate(56 118)">
    <rect class="box" x="0" y="0" width="188" height="126" rx="8"/>
    <text x="18" y="30" class="stage">RTL source</text>
    <text x="18" y="56" class="small">state · widths · muxes</text>
    <text x="18" y="78" class="small">sharing · pipelines</text>
    <text x="18" y="100" class="small">cycle-level protocol</text>
    <path class="line" d="M188 63H232"/><path class="blue" d="M232 63l-12-7v14z"/>

    <rect class="soft" x="232" y="18" width="148" height="90" rx="8"/>
    <text x="254" y="49" class="stage">Synthesis</text>
    <text x="254" y="75" class="small">logic and arithmetic</text>
    <text x="254" y="95" class="small">canonicalization</text>
    <path class="line" d="M380 63H424"/><path class="blue" d="M424 63l-12-7v14z"/>

    <rect class="soft" x="424" y="18" width="158" height="90" rx="8"/>
    <text x="446" y="49" class="stage">Technology mapping</text>
    <text x="446" y="75" class="small">target LUTs or cells</text>
    <text x="446" y="95" class="small">resource structure</text>
    <path class="line" d="M582 63H626"/><path class="blue" d="M626 63l-12-7v14z"/>

    <rect class="soft" x="626" y="18" width="148" height="90" rx="8"/>
    <text x="648" y="49" class="stage">Placement</text>
    <text x="648" y="75" class="small">physical locations</text>
    <text x="648" y="95" class="small">seed-sensitive search</text>
    <path class="line" d="M774 63H818"/><path class="blue" d="M818 63l-12-7v14z"/>

    <rect class="soft" x="818" y="18" width="148" height="90" rx="8"/>
    <text x="840" y="49" class="stage">Routing</text>
    <text x="840" y="75" class="small">wire delay · fanout</text>
    <text x="840" y="95" class="small">congestion effects</text>
  </g>

  <path class="blueStroke" d="M1022 180v66"/><path class="blue" d="M1022 254l-7-12h14z"/>
  <text x="1022" y="282" class="stage" text-anchor="middle">Implementation measurements</text>

  <g transform="translate(56 338)">
    <rect class="box" x="0" y="0" width="320" height="144" rx="8"/>
    <text x="18" y="31" class="stage">VTR total-area estimate</text>
    <text x="18" y="60" class="body">Implementation resource estimate</text>
    <text x="18" y="88" class="small">Measured on the pinned academic architecture.</text>
    <text x="18" y="111" class="small">Not ASIC die area or commercial-FPGA characterization.</text>

    <rect class="box" x="344" y="0" width="320" height="144" rx="8"/>
    <text x="362" y="31" class="stage">Post-route critical-path delay</text>
    <text x="362" y="60" class="body">Timing of the limiting routed path</text>
    <text x="362" y="88" class="small">Lower tcrit implies a higher implementation clock bound.</text>
    <text x="362" y="111" class="small">Not complete-system throughput or application latency.</text>

    <rect class="box" x="688" y="0" width="320" height="144" rx="8"/>
    <text x="706" y="31" class="stage">Active total-power estimate</text>
    <text x="706" y="60" class="body">Power under the declared activity model</text>
    <text x="706" y="88" class="small">PTM 45 nm conditions are fixed inside each case.</text>
    <text x="706" y="111" class="small">Not board, thermal, measured-energy, or silicon evidence.</text>
  </g>

  <text x="56" y="530" class="body">Baseline and accepted RTL use the same frozen target and matched implementation conditions.</text>
  <text x="56" y="557" class="small">The paired estimator measures whether the RTL change survives implementation variation, rather than selecting one favorable run.</text>
</svg>
