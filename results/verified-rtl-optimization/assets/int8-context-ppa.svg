<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" role="img" aria-label="INT8 MatVec architecture context and paired PPA estimate">
  <rect width="1240" height="520" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:24px;font-weight:700}.node{font-size:14px;font-weight:700}.body{font-size:15px}.small{font-size:12.5px;fill:#5f5f5f}.box{fill:#fff;stroke:#111;stroke-width:1.8}.hot{fill:#fff;stroke:#005bff;stroke-width:2.5}.line{fill:none;stroke:#111;stroke-width:2}.muted{fill:none;stroke:#c4c4c4;stroke-width:1}.ci{stroke:#005bff;stroke-width:2.2;stroke-linecap:round}.dot{fill:#005bff}.tick{font-size:11px;fill:#686868}
  </style>
  <text x="48" y="44" class="title">INT8 MatVec datapath</text>
  <text x="700" y="44" class="title">Paired implementation estimate</text>
  <text x="700" y="68" class="small">64 publication pairs · two-sided 95% intervals</text>
  <path class="muted" d="M655 28V458"/>

  <g transform="translate(48 100)">
    <rect class="box" x="0" y="28" width="110" height="72" rx="7"/>
    <text x="55" y="56" text-anchor="middle" class="node">4 activations</text>
    <text x="55" y="79" text-anchor="middle" class="small">signed INT8</text>
    <rect class="box" x="0" y="126" width="110" height="72" rx="7"/>
    <text x="55" y="154" text-anchor="middle" class="node">4×4 weights</text>
    <text x="55" y="177" text-anchor="middle" class="small">signed INT8</text>
    <path class="line" d="M110 64H154M110 162H154"/>
    <rect class="box" x="154" y="62" width="132" height="102" rx="7"/>
    <text x="220" y="94" text-anchor="middle" class="node">16 products</text>
    <text x="220" y="118" text-anchor="middle" class="small">exact signed 8×8</text>
    <text x="220" y="140" text-anchor="middle" class="small">16-bit results</text>
    <path class="line" d="M286 113H322"/>
    <rect class="hot" x="322" y="46" width="164" height="134" rx="7"/>
    <text x="404" y="80" text-anchor="middle" class="node">Row reductions</text>
    <text x="404" y="106" text-anchor="middle" class="small">17-bit pair sums</text>
    <text x="404" y="128" text-anchor="middle" class="small">18-bit balanced tree</text>
    <text x="404" y="154" text-anchor="middle" class="small">single final extension</text>
    <path class="line" d="M486 113H520"/>
    <rect class="box" x="520" y="78" width="82" height="70" rx="7"/>
    <text x="561" y="106" text-anchor="middle" class="node">y[0:3]</text>
    <text x="561" y="129" text-anchor="middle" class="small">INT32</text>

    <text x="0" y="222" class="body">The accepted RTL keeps exact products narrow, uses range-correct intermediate widths,</text>
    <text x="0" y="246" class="body">and balances the row reduction before the final 32-bit extension.</text>
    <text x="0" y="280" class="small">Ports, signedness, combinational behavior, overflow semantics, and exact dot-product arithmetic remain fixed.</text>
  </g>

  <g>
    <path class="muted" d="M790 110V402M870 110V402M950 110V402M1030 110V402M1110 110V402"/>
    <text x="790" y="424" class="tick" text-anchor="middle">0%</text><text x="870" y="424" class="tick" text-anchor="middle">4%</text><text x="950" y="424" class="tick" text-anchor="middle">8%</text><text x="1030" y="424" class="tick" text-anchor="middle">12%</text><text x="1110" y="424" class="tick" text-anchor="middle">16%</text>
    <text x="700" y="136" class="body">Area</text><line class="ci" x1="1100.7" y1="132" x2="1103.1" y2="132"/><line class="ci" x1="1100.7" y1="126" x2="1100.7" y2="138"/><line class="ci" x1="1103.1" y1="126" x2="1103.1" y2="138"/><circle class="dot" cx="1101.9" cy="132" r="5"/><text x="1210" y="136" class="small" text-anchor="end">15.5943%</text>
    <text x="700" y="206" class="body">Delay</text><line class="ci" x1="841.7" y1="202" x2="865.7" y2="202"/><line class="ci" x1="841.7" y1="196" x2="841.7" y2="208"/><line class="ci" x1="865.7" y1="196" x2="865.7" y2="208"/><circle class="dot" cx="853.7" cy="202" r="5"/><text x="1210" y="206" class="small" text-anchor="end">3.1868%</text>
    <text x="700" y="276" class="body">Power</text><line class="ci" x1="893.2" y1="272" x2="915.0" y2="272"/><line class="ci" x1="893.2" y1="266" x2="893.2" y2="278"/><line class="ci" x1="915.0" y1="266" x2="915.0" y2="278"/><circle class="dot" cx="904.2" cy="272" r="5"/><text x="1210" y="276" class="small" text-anchor="end">5.7081%</text>
    <text x="700" y="346" class="body">Composite</text><line class="ci" x1="954.0" y1="342" x2="959.0" y2="342"/><line class="ci" x1="954.0" y1="336" x2="954.0" y2="348"/><line class="ci" x1="959.0" y1="336" x2="959.0" y2="348"/><circle class="dot" cx="956.5" cy="342" r="5"/><text x="1210" y="346" class="small" text-anchor="end">8.3230%</text>
  </g>
  <text x="700" y="458" class="small">Academic LUT6 target; no commercial DSP or BRAM model. Improvement is case-local.</text>
</svg>
