<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-label="Common evidence contract">
  <rect width="1040" height="420" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill:#111; }
    .title { font-size:26px; font-weight:700; }
    .label { font-size:16px; font-weight:700; letter-spacing:.06em; }
    .body { font-size:18px; }
    .small { font-size:14px; fill:#5f5f5f; }
    .box { fill:#fff; stroke:#111; stroke-width:2; }
    .line { fill:none; stroke:#111; stroke-width:2.5; }
    .bluefill { fill:#005bff; }
  </style>
<text x="48" y="50" class="title">Frozen contract → correctness → paired evidence</text>
<g transform="translate(48 105)">
  <rect class="box" x="0" y="0" width="155" height="95" rx="8"/>
  <text x="18" y="32" class="label">FREEZE</text>
  <text x="18" y="58" class="small">interface · tests</text>
  <text x="18" y="78" class="small">target · metrics</text>
  <path class="line" d="M155 47 H205"/><path class="bluefill" d="M205 47 l-12 -7 v14 z"/>
  <rect class="box" x="205" y="0" width="155" height="95" rx="8"/>
  <text x="223" y="32" class="label">TRANSFORM</text>
  <text x="223" y="58" class="small">bounded RTL</text>
  <text x="223" y="78" class="small">source change</text>
  <path class="line" d="M360 47 H410"/><path class="bluefill" d="M410 47 l-12 -7 v14 z"/>
  <rect class="box" x="410" y="0" width="155" height="95" rx="8"/>
  <text x="428" y="32" class="label">CORRECTNESS</text>
  <text x="428" y="58" class="small">functional + formal</text>
  <text x="428" y="78" class="small">fail closed</text>
  <path class="line" d="M565 47 H615"/><path class="bluefill" d="M615 47 l-12 -7 v14 z"/>
  <rect class="box" x="615" y="0" width="155" height="95" rx="8"/>
  <text x="633" y="32" class="label">MEASURE</text>
  <text x="633" y="58" class="small">area · delay · power</text>
  <text x="633" y="78" class="small">64 paired runs</text>
  <path class="line" d="M770 47 H820"/><path class="bluefill" d="M820 47 l-12 -7 v14 z"/>
  <rect x="820" y="0" width="160" height="95" rx="8" fill="#005bff"/>
  <text x="838" y="32" class="label" style="fill:white">EVIDENCE</text>
  <text x="838" y="58" class="small" style="fill:white">before / after</text>
  <text x="838" y="78" class="small" style="fill:white">patch + proof</text>
</g>
<text x="48" y="260" class="body">A candidate that fails correctness never becomes a PPA result.</text>
<text x="48" y="292" class="small">Current public cases use a pinned academic VTR/PTM 45 nm LUT6 target. Case-local paired estimates only.</text>
</svg>
