<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="Frozen RTL evaluation contract from source change through correctness, paired measurement, and evidence publication">
  <rect width="1040" height="300" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.main{font-size:17px;font-weight:650}.small{font-size:13px;fill:#5f5f5f}.math{font-size:18px;font-family:Menlo,Consolas,monospace}.line{fill:none;stroke:#111;stroke-width:2}.blue{fill:#005bff}.node{fill:#fff;stroke:#bdbdbd;stroke-width:1.4}.hot{fill:#fff;stroke:#005bff;stroke-width:2.2}
  </style>
  <g transform="translate(34 52)">
    <rect class="node" x="0" y="0" width="174" height="104" rx="7"/>
    <text x="16" y="31" class="math">contract C</text>
    <text x="16" y="57" class="small">interface · tests · target</text>
    <text x="16" y="78" class="small">toolchain · metrics · limits</text>
    <text x="16" y="96" class="small">frozen before measurement</text>
    <path class="line" d="M174 52H214"/><path class="blue" d="M214 52l-11-7v14z"/>

    <rect class="node" x="214" y="0" width="174" height="104" rx="7"/>
    <text x="230" y="31" class="math">RTL₀ → RTL₁</text>
    <text x="230" y="57" class="small">bounded source delta</text>
    <text x="230" y="78" class="small">same external contract</text>
    <path class="line" d="M388 52H428"/><path class="blue" d="M428 52l-11-7v14z"/>

    <rect class="node" x="428" y="0" width="174" height="104" rx="7"/>
    <text x="444" y="31" class="math">verify(C, RTL₁)</text>
    <text x="444" y="57" class="small">functional + formal checks</text>
    <text x="444" y="78" class="small">required evidence must pass</text>
    <path class="line" d="M602 52H642"/><path class="blue" d="M642 52l-11-7v14z"/>

    <rect class="node" x="642" y="0" width="174" height="104" rx="7"/>
    <text x="658" y="31" class="math">xᵢ⁰ , xᵢ¹</text>
    <text x="658" y="57" class="small">matched implementation pair i</text>
    <text x="658" y="78" class="small">A · tcrit · Pactive</text>
    <path class="line" d="M816 52H856"/><path class="blue" d="M856 52l-11-7v14z"/>

    <rect class="hot" x="856" y="0" width="150" height="104" rx="7"/>
    <text x="872" y="31" class="math">{RTL₀, RTL₁, Δ}</text>
    <text x="872" y="57" class="small">exact patch + proof</text>
    <text x="872" y="78" class="small">metrics + provenance</text>
  </g>
  <text x="34" y="205" class="main">If verify(C, RTL₁) fails, no PPA result is admitted.</text>
  <text x="34" y="232" class="small">The public cases then estimate accepted/baseline ratios from 64 fixed publication pairs under the same frozen implementation contract.</text>
</svg>
