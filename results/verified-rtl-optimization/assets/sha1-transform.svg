<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="SHA-1 before-and-after RTL rewrite from separate Boolean logic and temporary state concatenation to shared terms and direct state readout">
  <rect width="960" height="330" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.rtl{font-size:17px;font-family:Menlo,Consolas,monospace;font-weight:650}.body{font-size:17px}.small{font-size:13.5px;fill:#5f5f5f}.box{fill:#fff;stroke:#111;stroke-width:2}.accent{fill:none;stroke:#005bff;stroke-width:4}.line{fill:none;stroke:#111;stroke-width:2.5}.muted{fill:none;stroke:#b9b9b9;stroke-width:2}.blue{fill:#005bff}
  </style>
  <g transform="translate(60 50)">
    <text x="0" y="0" class="rtl">RTL₀</text>
    <rect class="box" x="0" y="24" width="340" height="180" rx="8"/>
    <text x="20" y="61" class="body">Separate f2 / f3 logic</text>
    <path class="muted" d="M36 98H145M36 138H145"/>
    <rect x="155" y="84" width="88" height="30" fill="#f4f4f4" stroke="#111"/>
    <rect x="155" y="124" width="88" height="30" fill="#f4f4f4" stroke="#111"/>
    <text x="176" y="104" class="small">parity</text><text x="168" y="144" class="small">majority</text>
    <text x="20" y="184" class="small">temporary 160-bit result concatenation</text>

    <path class="line" d="M378 114H456"/><path class="blue" d="M456 114l-14-8v16z"/>

    <text x="492" y="0" class="rtl">RTL₁</text>
    <rect class="box" x="492" y="24" width="340" height="180" rx="8"/>
    <text x="512" y="61" class="body">Shared XOR terms</text>
    <path class="accent" d="M527 102H662M527 136H662"/>
    <circle cx="677" cy="119" r="12" fill="#005bff"/>
    <text x="707" y="124" class="small">shared core</text>
    <text x="512" y="184" class="small">direct readout from A · B · C · D · E</text>
  </g>
  <text x="60" y="286" class="small">The command interface, cycle behavior, latency, and output order are unchanged under the declared correctness contract.</text>
</svg>
