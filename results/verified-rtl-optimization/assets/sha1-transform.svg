  </style>
<text x="48" y="48" class="title">SHA-1 · simplify and share Boolean structure</text>
<text x="48" y="82" class="small">Cycle-equivalent change under the frozen command interface</text>
<g transform="translate(60 120)">
  <text x="0" y="0" class="label">BASELINE</text>
  <rect class="box" x="0" y="28" width="340" height="170" rx="8"/>
  <text x="20" y="65" class="body">Separate f2 / f3 logic</text>
