<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="SHA-1 transformation">
  <rect width="960" height="420" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill:#111; }
