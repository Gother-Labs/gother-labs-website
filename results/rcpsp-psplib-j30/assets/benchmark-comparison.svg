<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-label="Baseline, Evölther, and Evölther 2.0 RCPSP benchmark comparison">
  <style>.bg{fill:#050608}.panel{fill:#090d13;stroke:#242b38}.track{fill:#151b26}.muted{fill:#8f98aa;font:14px Inter,Arial,sans-serif}.label{fill:#cbd5e1;font:15px Inter,Arial,sans-serif}.title{fill:#f8fafc;font:600 24px Inter,Arial,sans-serif}.value{fill:#f8fafc;font:700 22px Inter,Arial,sans-serif}.accent{fill:#168cff}.mid{fill:#7aaee8}.seed{fill:#667085}.delta{fill:#168cff;font:700 18px Inter,Arial,sans-serif}.axis{stroke:#343c4d}</style>
  <rect class="bg" width="1040" height="520"/><text x="64" y="52" class="title">Acceptance objective</text><text x="976" y="52" class="muted" text-anchor="end">lower is better · same frozen contract</text>
  <rect class="track" x="230" y="102" width="674" height="42" rx="4"/><rect class="seed" x="230" y="102" width="643" height="42" rx="4"/><text x="64" y="129" class="label">Baseline</text><text x="888" y="129" class="value" text-anchor="end">14.312</text>
  <rect class="track" x="230" y="176" width="674" height="42" rx="4"/><rect class="mid" x="230" y="176" width="543" height="42" rx="4"/><text x="64" y="203" class="label">Evölther</text><text x="788" y="203" class="value">12.087</text>
  <rect class="track" x="230" y="250" width="674" height="42" rx="4"/><rect class="accent" x="230" y="250" width="454" height="42" rx="4"/><text x="64" y="277" class="label">Evölther 2.0</text><text x="699" y="277" class="value">10.108</text>
  <path class="axis" d="M230 322H904"/><text x="230" y="347" class="muted">0</text><text x="567" y="347" class="muted" text-anchor="middle">7.5</text><text x="904" y="347" class="muted" text-anchor="end">15</text>
  <g transform="translate(64 388)"><rect class="panel" width="276" height="82" rx="6"/><text x="18" y="28" class="muted">Baseline → current</text><text x="18" y="59" class="delta">29.37% reduction</text></g>
  <g transform="translate(382 388)"><rect class="panel" width="276" height="82" rx="6"/><text x="18" y="28" class="muted">Previous → current</text><text x="18" y="59" class="delta">16.37% reduction</text></g>
  <g transform="translate(700 388)"><rect class="panel" width="276" height="82" rx="6"/><text x="18" y="28" class="muted">Feasible schedules</text><text x="18" y="59" class="value">80 / 80</text></g>
